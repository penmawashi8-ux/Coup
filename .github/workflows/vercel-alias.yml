name: Register Vercel Domain

on:
  push:
    branches: [main]

jobs:
  register-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Register bouryaku.boardgamecat.com as custom domain
        run: |
          curl -s -X POST "https://api.vercel.com/v9/projects/bouryaku-two/domains" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name": "bouryaku.boardgamecat.com"}' \
            | tee /dev/stderr | grep -q '"name"'
